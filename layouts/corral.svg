  <g fill="#5b606a"><rect x="6" y="194" width="24" height="2.5" rx="1.2"/><rect x="36" y="194" width="20" height="2.5" rx="1.2"/><rect x="62" y="194" width="26" height="2.5" rx="1.2"/></g>
