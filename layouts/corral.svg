  <rect x="163" y="8" width="84" height="12" rx="5" fill="#202226"/>
  <g fill="#4b4f57"><rect x="169" y="28" width="60" height="3" rx="1.5"/><rect x="169" y="52" width="54" height="3" rx="1.5"/><rect x="169" y="60" width="62" height="3" rx="1.5"/></g>
  <rect x="164" y="35" width="82" height="7" fill="#26382a"/><rect x="169" y="37" width="50" height="3" rx="1.5" fill="#9ece6a"/>
  <rect x="164" y="43" width="82" height="7" fill="#3a2427"/><rect x="169" y="45" width="44" height="3" rx="1.5" fill="#f7768e"/>
