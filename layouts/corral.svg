  <rect x="251" y="8" width="64" height="178" rx="5" fill="#1a1b1e" stroke="#2c2f35" stroke-width="1"/>
  <g fill="#5b606a"><rect x="256" y="14" width="10" height="3" rx="1.5"/><rect x="270" y="14" width="12" height="3" rx="1.5"/><rect x="286" y="14" width="10" height="3" rx="1.5"/><rect x="300" y="14" width="10" height="3" rx="1.5"/></g>
  <rect x="284" y="20" width="14" height="1.5" fill="#7aa2f7"/>
